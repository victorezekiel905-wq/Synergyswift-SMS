# Render Blueprint for Synergy Swift. (Service names keep their original "educlass" ids so existing Render services are not replaced.)
# In Render: New → Blueprint → pick this repository. Render reads this file,
# creates the web app and the two scheduled jobs, and asks for every value
# marked `sync: false`. See docs/DEPLOY_RENDER.md.

envVarGroups:
  # Shared by the app and the scheduled jobs.
  - name: educlass-shared
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: educlass-fusion
    runtime: node
    region: frankfurt          # closest Render region to West Africa; match your Supabase region
    plan: starter              # free instances sleep after 15 minutes; schools need it always on
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - fromGroup: educlass-shared
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ---- Required ----
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL      # e.g. https://educlass-fusion.onrender.com, or your own domain
        sync: false
      # ---- Email: SendGrid or Resend. Also sends the sign-in emails (confirm account, reset password). ----
      - key: EMAIL_PROVIDER           # sendgrid or resend
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM               # e.g. "School Updates <updates@yourdomain.com>"
        sync: false
      # ---- WhatsApp (Meta Cloud API) ----
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: "234"
      # Google / Microsoft sign-in buttons: providers enabled in Supabase Auth, e.g. google,azure
      - key: NEXT_PUBLIC_SSO_PROVIDERS
        sync: false
      # ---- Online payments ----
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # ---- SMS ----
      - key: SMS_PROVIDER
        value: termii
      - key: TERMII_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      # ---- App notifications (npx web-push generate-vapid-keys) ----
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT            # e.g. mailto:ops@yourdomain.com
        sync: false
      # ---- Native app notifications (Firebase service account; docs/MOBILE_APPS.md) ----
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      # ---- Google Classroom and Microsoft Teams/OneNote (teachers connect their own accounts) ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT
        value: common
      # ---- AI on Google Gemini (phase 14p) ----
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_MONTHLY_LIMIT
        value: "3000"
      # Groq and OpenRouter need only their key; other OpenAI-compatible text AI (see .env.example):
      # AI_EXTRA_1_NAME/_URL/_KEY/_MODEL, up to 6.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_EXTRA_1_NAME
        sync: false
      - key: AI_EXTRA_1_URL
        sync: false
      - key: AI_EXTRA_1_KEY
        sync: false
      - key: AI_EXTRA_1_MODEL
        sync: false
      - key: AI_ROTATE
        value: "0"
      - key: PIXABAY_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false
      # Only used when GEMINI_API_KEY is empty.
      - key: ANTHROPIC_API_KEY
        sync: false

  # Sends queued messages and retries failures, every minute.
  - type: cron
    name: educlass-dispatch
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "* * * * *"
    buildCommand: "true"
    startCommand: node scripts/cron-call.mjs /api/cron/dispatch
    envVars:
      - fromGroup: educlass-shared
      - key: APP_HOST
        fromService:
          type: web
          name: educlass-fusion
          property: host

  # Daily housekeeping: expire pickup codes, close finished exams, library reminders.
  - type: cron
    name: educlass-daily
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 5 * * *"            # 05:00 UTC = 06:00 in Lagos
    buildCommand: "true"
    startCommand: node scripts/cron-call.mjs /api/cron/daily
    envVars:
      - fromGroup: educlass-shared
      - key: APP_HOST
        fromService:
          type: web
          name: educlass-fusion
          property: host
